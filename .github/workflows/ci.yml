name: CI

on:
  pull_request:
  push:
    # main is the repo's sole integration branch — every milestone branches
    # from and merges back into it.
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.1"

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # Backs apps/api's e2e tests: the M1A health-check and, from M1B, the
      # Admins/Users CRUD API against real migrated tables — a real
      # database, not a mock, so CI genuinely proves the behavior rather
      # than just that the code compiles.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maya_x
          POSTGRES_PASSWORD: maya_x_ci_password
          POSTGRES_DB: maya_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maya_x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's own postinstall hook looks for a schema at the
      # workspace root and no-ops here (it's at apps/api/prisma/schema.prisma),
      # so the client is left with its placeholder (model-less) types unless
      # generated explicitly — needed before typecheck/build even reference
      # the client, not just before the DB-touching test steps below.
      - name: Generate Prisma Client
        run: pnpm --filter @maya-x/api exec prisma generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter @maya-x/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test
          DIRECT_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test

      - name: Test (e2e — requires the postgres service above)
        run: pnpm --filter @maya-x/api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test
          DIRECT_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test
          # M3: e2e boots the full AppModule, so ConfigModule's startup
          # validation requires these — CI-only values, never used outside
          # this ephemeral job.
          JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else-00
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else-00
          # M5B: also required for ConfigModule startup validation. Real
          # Razorpay API calls never happen in this job — payments.e2e-spec.ts
          # overrides the RAZORPAY_GATEWAY provider with a stub, so these
          # placeholders only need to satisfy env.validation.ts, not
          # actually authenticate against Razorpay.
          RAZORPAY_KEY_ID: rzp_test_ci_placeholder_not_a_real_key
          RAZORPAY_KEY_SECRET: ci-only-razorpay-key-secret-placeholder
          RAZORPAY_WEBHOOK_SECRET: ci-only-razorpay-webhook-secret-placeholder
          # M6: also required for ConfigModule startup validation. Real
          # Cloudinary API calls never happen in this job — media.e2e-spec.ts
          # overrides the CLOUDINARY_GATEWAY provider with a stub, so these
          # placeholders only need to satisfy env.validation.ts, not
          # actually authenticate against Cloudinary.
          CLOUDINARY_CLOUD_NAME: ci-only-cloud-name-placeholder
          CLOUDINARY_API_KEY: ci-only-api-key-placeholder
          CLOUDINARY_API_SECRET: ci-only-api-secret-placeholder

      - name: Build
        run: pnpm build
