name: CI

on:
  pull_request:
  push:
    # "main" is the intended long-term default branch; the second name is
    # this repository's current default (an artifact of how it was first
    # created) — keep both until the repo is formally switched over to main.
    branches: [main, claude/open-repository-36ktwf]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.1"

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # Backs apps/api's e2e health-check test (M1A) — a real database, not
      # a mock, so CI genuinely proves connectivity rather than just that
      # the code compiles.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maya_x
          POSTGRES_PASSWORD: maya_x_ci_password
          POSTGRES_DB: maya_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maya_x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test (e2e — requires the postgres service above)
        run: pnpm --filter @maya-x/api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test
          DIRECT_URL: postgresql://maya_x:maya_x_ci_password@localhost:5432/maya_x_test

      - name: Build
        run: pnpm build
